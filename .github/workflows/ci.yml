name: CI & Quality Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: jobs only read the repository. actions/cache authenticates
# with the runtime cache token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs; the trailing comment names
# the release tag the SHA was resolved from. Job names are the required status
# check contexts in scripts/setup-github-protection.sh; rename them together.
jobs:
  test-rust:
    name: 🦀 Rust Core Tests (cxi / codex-mon)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Installs the exact channel and components from
      # codex-switcher/rust-toolchain.toml (rustup >= 1.28).
      - name: Setup Rust
        working-directory: codex-switcher
        run: |
          rustup --version
          rustup toolchain install
          rustc --version
          cargo clippy --version

      # Keyed on the toolchain and the committed Cargo.lock: a toolchain bump
      # or a reviewed dependency change gets a fresh key, and artifacts from
      # another compiler are never restored.
      - name: Cargo Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            codex-switcher/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('codex-switcher/rust-toolchain.toml') }}-${{ hashFiles('codex-switcher/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ hashFiles('codex-switcher/rust-toolchain.toml') }}-

      # Lints every target, tests included, with the pinned Clippy against the
      # committed Cargo.lock. The command and directory are enforced by
      # codex-switcher/tests/ci_workflow_policy/clippy_gate.rs.
      - name: Run Clippy on All Targets
        working-directory: codex-switcher
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # --locked fails the run if Cargo.lock is missing or would change,
      # instead of testing a freshly resolved dependency graph. The condition
      # lets the tests report after a Clippy failure, as the shell tests below
      # do after any earlier failure.
      - name: Run Rust Unit Tests
        if: ${{ !cancelled() }}
        working-directory: codex-switcher
        run: cargo test --locked --verbose

      # Runs a copy of scripts/uninstall.sh against temporary homes, with
      # launchctl, osascript, defaults, lsregister, getconf, ps, and kill
      # replaced by fakes, so the runner's launchd, login items, processes,
      # and /Applications are never touched. It builds codex-mon itself,
      # from codex-switcher/ and with the committed Cargo.lock. Every
      # tracked tests/*.sh needs a step like this one in a required job,
      # setting only `name`, `if: ${{ !cancelled() }}`, and
      # `run: bash <script>`, as enforced by
      # codex-switcher/tests/ci_workflow_policy/shell_test_gate.rs. The
      # condition runs each shell test even after an earlier step failed, so
      # one failure does not hide the others; a failed step still fails the
      # job, and a cancelled run skips it.
      - name: Run Uninstall Shell Test
        if: ${{ !cancelled() }}
        run: bash tests/log_permissions_and_uninstall.sh

      # The installer tests below work on temporary directories and on copies
      # of the installer helpers whose ps, kill, launchctl, and sleep are
      # fakes, or only read scripts/install.sh. They never install, sign an
      # installed app, signal a real process, or touch launchd. The lock
      # test runs install.sh's own install lock with a fake getconf; its log
      # names the lock tools this runner offers.
      - name: Run Installer Lock Shell Test
        if: ${{ !cancelled() }}
        run: bash tests/install_lock.sh

      - name: Run Installer Bundle Swap Shell Test
        if: ${{ !cancelled() }}
        run: bash tests/install_bundle_swap.sh

      - name: Run Installer CLI Staging Order Shell Test
        if: ${{ !cancelled() }}
        run: bash tests/install_cli_staging_signature.sh

      - name: Run Installer Log Redaction Order Shell Test
        if: ${{ !cancelled() }}
        run: bash tests/install_log_redaction_quiescence.sh

      - name: Run Installer Monitor Process Guard Shell Test
        if: ${{ !cancelled() }}
        run: bash tests/install_monitor_process_guard.sh

      - name: Run Installer Restart Worker Wait Shell Test
        if: ${{ !cancelled() }}
        run: bash tests/install_restart_worker_wait.sh

  # Not a required check. The required jobs run on macOS 14, which ships no
  # /usr/bin/lockf, so the installer lock there always falls back to perl;
  # this job runs the same test where lockf's descriptor form, the path
  # macOS 15 and later take, exists.
  install-lock-macos-15:
    name: 🔐 Installer Lock with lockf (macOS 15)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Require lockf
        run: test -x /usr/bin/lockf

      # /bin/bash is the bash 3.2 the installer runs under. The required
      # job's `bash tests/install_lock.sh` step stays the one gate for it.
      - name: Run Installer Lock Shell Test with lockf
        run: /bin/bash tests/install_lock.sh

  test-swift:
    name: 🍏 Swift Menu Bar App Tests
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Swift Test Suites
        run: |
          chmod +x ./scripts/test_swift.sh
          ./scripts/test_swift.sh

      # Compiles the recovery banner from its source manifest into a temporary
      # directory; nothing is installed or launched.
      - name: Run Recovery Banner Manifest Shell Test
        if: ${{ !cancelled() }}
        run: bash tests/recovery_banner_manifest.sh

      # test_swift.sh also runs this test before its first compile, for local
      # runs. The policy cannot see inside that script, so this step is the
      # enforced run.
      - name: Run Swift Module Cache Path Shell Test
        if: ${{ !cancelled() }}
        run: bash tests/swift_module_cache_path.sh

      # Only reads tests/*.swift and Sources/*.swift, plus fixtures it writes
      # to a temporary directory. test_swift.sh also runs it before compiling;
      # this step is the run the policy enforces.
      - name: Run Swift Test Defaults Isolation Shell Test
        if: ${{ !cancelled() }}
        run: bash tests/swift_test_defaults_isolation.sh

      # Only reads tests/*.swift and Sources/*.swift, plus fixtures it writes
      # to a temporary directory; it never resolves or opens a Codex home.
      # test_swift.sh also runs it before compiling; this step is the run the
      # policy enforces.
      - name: Run Swift Test Codex Home Isolation Shell Test
        if: ${{ !cancelled() }}
        run: bash tests/swift_test_codex_home_isolation.sh

      # Only reads Sources/*.swift, tests/*.swift, scripts/test_swift.sh, and
      # the workflows, plus fixtures it writes to a temporary directory.
      # test_swift.sh also runs it before compiling; this step is the run the
      # policy enforces.
      - name: Run Swift Test Live System Isolation Shell Test
        if: ${{ !cancelled() }}
        run: bash tests/swift_test_live_system_isolation.sh

      # Only reads tests/*.swift, plus fixtures it writes to a temporary
      # directory. test_swift.sh also runs it before compiling; this step is
      # the run the policy enforces.
      - name: Run Swift Test Status Items Shell Test
        if: ${{ !cancelled() }}
        run: bash tests/swift_test_status_items.sh

  security-scan:
    name: 🔒 Security & Privacy Scan
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check for Leaked Tokens or Secrets
        run: |
          echo "Scanning codebase for potential secrets..."
          if grep -rnE "sk-[a-zA-Z0-9]{20,}" . --exclude-dir=".git" ; then
            echo "❌ Error: Potential OpenAI API key pattern found!"
            exit 1
          fi
          echo "✅ Security scan clean."
