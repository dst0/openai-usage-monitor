<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1e24" />
      <stop offset="100%" stop-color="#0c0e11" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="spiralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d977" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#bgGrad)" />
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#glowGrad)" />
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="10" />

  <!-- 6-Petal Geometric Spiral Motif -->
  <g transform="translate(512, 512)" stroke="url(#spiralGrad)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Rotated arms -->
    <path d="M 0,-115 C 80,-115 150,-40 180,45 C 200,90 200,160 145,215" />
    <path d="M 0,-115 C 80,-115 150,-40 180,45 C 200,90 200,160 145,215" transform="rotate(60)" />
    <path d="M 0,-115 C 80,-115 150,-40 180,45 C 200,90 200,160 145,215" transform="rotate(120)" />
    <path d="M 0,-115 C 80,-115 150,-40 180,45 C 200,90 200,160 145,215" transform="rotate(180)" />
    <path d="M 0,-115 C 80,-115 150,-40 180,45 C 200,90 200,160 145,215" transform="rotate(240)" />
    <path d="M 0,-115 C 80,-115 150,-40 180,45 C 200,90 200,160 145,215" transform="rotate(300)" />
  </g>

  <!-- Central Hub -->
  <circle cx="512" cy="512" r="48" fill="#00f5a0" />
</svg>
