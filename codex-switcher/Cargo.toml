[package]
name = "codex-switcher"
version = "0.1.0"
edition = "2021"
authors = ["Codex Monitor Contributors"]
description = "High-performance, minimal-memory OpenAI Codex account switcher & quota monitor"

[[bin]]
name = "codex-mon"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
clap = { version = "4.4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
getrandom = "0.2"
ring = "0.17"
brotli = "9.0.0"
